name: Branch flow

on:
  pull_request:
    branches: [staging, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-flow:
    # Required status check on both rulesets. Rename both together.
    name: Branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce allowed source branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD_REF -> $BASE_REF"
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "staging" ]; then
              echo "::error::Only 'staging' may be merged into 'main'. Open your PR against 'staging' instead."
              exit 1
            fi
          elif [ "$BASE_REF" = "staging" ]; then
            if ! echo "$HEAD_REF" | grep -Eq '^(feature|fix|chore|docs|refactor|dependabot)/'; then
              echo "::error::Branches merged into 'staging' must start with feature/, fix/, chore/, docs/ or refactor/."
              exit 1
            fi
          fi
          echo "Branch flow OK."

  pr-title:
    # Squash merges into staging use the PR title as the commit message.
    name: PR title
    if: github.base_ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $TITLE"
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(workspaces): add create dialog'."
            exit 1
          fi
          echo "PR title OK."
