        - generic [ref=f3e283]:
          - term [ref=f3e284]: AI questions (Ask Atlas)
          - definition [ref=f3e285]: Generous limits that protect the service from abuse, not normal use.
        - generic [ref=f3e286]:
          - term [ref=f3e287]: Use your own API key
          - definition [ref=f3e288]: Connect your own AI provider key. Questions and reports then use your key and are not limited by plan quotas. Storage, file size and page limits still apply. Indexing always uses Atlas's own model so search stays consistent.
        - generic [ref=f3e289]:
          - term [ref=f3e290]: Document processing
          - definition [ref=f3e291]: Pro documents start processing ahead of the standard queue when the system is busy.
